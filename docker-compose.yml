x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: seatlock-api
  profiles: ["app"]
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    DB_USER: seatlock
    DB_PASSWORD: seatlock
    DB_NAME: seatlock
    DB_SSL: "false"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
      POSTGRES_DB: seatlock
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    <<: *api
    command: ["node", "dist/database/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
